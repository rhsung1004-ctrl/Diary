# 처음 한 번만 실행: Flutter 안드로이드 프로젝트 파일(android/)과 앱 아이콘을 만들어 커밋합니다.
name: Setup Android project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate android/
        run: |
          if [ -d android ]; then echo "android/ 가 이미 있어요"; exit 0; fi
          flutter create --platforms=android --org io.github.rhsung1004 --project-name lifebox .
          sed -i 's/android:label="[^"]*"/android:label="LifeBox"/' android/app/src/main/AndroidManifest.xml

      - name: Launcher icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Commit
        run: |
          flutter --version | head -1 > .flutter-version-used
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate Android project and launcher icons" || echo "변경 없음"
          git push
