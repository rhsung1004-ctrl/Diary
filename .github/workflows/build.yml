name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 최신 APK를 Releases에 올리기
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 서명 키는 저장소 Secrets 에서만 꺼내 씀 (저장소에는 절대 올리지 않음)
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::서명 키 Secrets가 없어 임시(디버그) 키로 빌드합니다. 이 APK는 테스트용입니다."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get

      # 코드 오류를 Actions 화면에 바로 표시
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "^\s*error" analyze.txt | head -50 | while IFS= read -r line; do echo "::error::$line"; done
          ! grep -qE "^\s*error" analyze.txt

      - run: flutter test

      # 빌드 번호(versionCode)는 매번 1씩 올라감 → 플레이스토어 업로드 조건 충족
      - name: Build APK (폰에 바로 설치용)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build App Bundle (플레이스토어 업로드용)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v5
        with:
          name: LifeBox-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v5
        with:
          name: LifeBox-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab

      # 누구나 받을 수 있는 고정 링크에 최신 APK 올리기
      # https://github.com/<저장소>/releases/latest/download/LifeBox.apk
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 모든 기종용(큰 파일)은 예비로, 요즘 폰(64비트 ARM)용 가벼운 APK를 기본 링크로
          cp build/app/outputs/flutter-apk/app-release.apk LifeBox-universal.apk
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk LifeBox.apk
          zip -j LifeBox.zip LifeBox.apk   # 크롬에서 apk 다운로드가 멈출 때를 위한 zip
          ls -la LifeBox*
          NOTES="빌드 #${{ github.run_number }} · $(date -u +%Y-%m-%d)
          - LifeBox.zip : 압축을 풀면 LifeBox.apk (다운로드가 100%에서 멈출 때)
          - LifeBox.apk : 일반 휴대폰용 (가벼운 버전)
          - LifeBox-universal.apk : 설치가 안 될 때 쓰는 모든 기종용
          설치 시 '출처를 알 수 없는 앱' 허용이 필요해요."
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "LifeBox 최신 버전" --notes "$NOTES" --latest
          gh release upload apk LifeBox.zip LifeBox.apk LifeBox-universal.apk --clobber
          gh release edit apk --notes "$NOTES" --latest
