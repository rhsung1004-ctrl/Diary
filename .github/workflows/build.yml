name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 서명 키는 저장소 Secrets 에서만 꺼내 씀 (저장소에는 절대 올리지 않음)
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::서명 키 Secrets가 없어 임시(디버그) 키로 빌드합니다. 이 APK는 테스트용입니다."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get

      # 코드 오류를 Actions 화면에 바로 표시
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E "^\s*error" analyze.txt | head -50 | while IFS= read -r line; do echo "::error::$line"; done
          ! grep -qE "^\s*error" analyze.txt

      - run: flutter test

      # 빌드 번호(versionCode)는 매번 1씩 올라감 → 플레이스토어 업로드 조건 충족
      - name: Build APK (폰에 바로 설치용)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build App Bundle (플레이스토어 업로드용)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v5
        with:
          name: LifeBox-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v5
        with:
          name: LifeBox-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
