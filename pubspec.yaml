name: lifebox
description: 버킷리스트, 목표, 일기, 커리어를 한곳에 기록하는 개인 앱
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: any
  googleapis_auth: any
  local_auth: ^3.0.2
  crypto: any
  pdf: any
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#3D7A6E"
  adaptive_icon_foreground: assets/icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/licenses/
  # 모두 SIL Open Font License 1.1 (assets/fonts/licenses 참고)
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
    - family: GowunBatang
      fonts:
        - asset: assets/fonts/GowunBatang-Regular.ttf
        - asset: assets/fonts/GowunBatang-Bold.ttf
          weight: 700
    - family: NanumPenScript
      fonts:
        - asset: assets/fonts/NanumPenScript-Regular.ttf
